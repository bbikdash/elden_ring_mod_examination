[build-system]
# A list of packages that are needed to build your package:
requires = ["setuptools"] # REQUIRED if [build-system] table is used
# The name of the Python object that frontends will use to perform the build:
build-backend = "setuptools.build_meta" # If not defined, then legacy behavior can happen.

[project]
name = "erm_exam"
version = "0.0.1"
authors = [
    {name = "Bassam Bikdash", email = "bbikdash@github.com"}
]
description = "Bassam's Production Object Detection Training Framework"
readme = "README.md"
dependencies = [
    "numpy==2.4.2",
    "pandas==3.0.0",
    "tqdm>=4.67.3",
    "PyYaml>=6.0.3",
    "sty>=1.0.6",
    "isort>=7.0.0",
    "loguru>=0.7.3",
    "pytest>=9.0.2",
    "cryptography==46.0.5",
    "pycryptodome==3.23.0", "zstandard", "jupyter==1.1.1",
]

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
"Homepage" = "https://github.com/bbikdash/lightning_object_detection"


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
erm_exam = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "==3.14.3"
